name: cses_editor_host_sample
description: Independent host integration template using only public editor APIs.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cses_editor:
    path: ../..
  appflowy_editor:
    git:
      url: https://github.com/shichunlei/appflowy-editor.git
      ref: 9e7593134457eac9193a61ee4023a75de55fcc68
  path_provider: ^2.1.6
  crypto: ^3.0.7
  dio: ^5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.3

flutter:
  uses-material-design: true
