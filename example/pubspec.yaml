name: cses_offline_example
description: Standalone offline daily guidance example.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cses_editor:
    path: ..
  appflowy_editor:
    git:
      url: https://github.com/shichunlei/appflowy-editor.git
      ref: 9e7593134457eac9193a61ee4023a75de55fcc68
  provider: ^6.1.5+1
  lucide_icons_flutter: ^4.0.1
  crypto: ^3.0.7
  dio: ^5.11.1
  file_picker: ^13.3.0
  mime: ^2.1.0
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/daily_guidance_mountain.png
    - assets/images/中企云链_logo.png
    - 文档完整数据结构.json
